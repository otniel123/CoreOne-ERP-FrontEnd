@if(!getLoggedIn){
  <section class="login-page">
    <div class="login-card">
      <img src="assets/logo.svg" alt="Logo CoreOne" class="login-logo" />
  
      <h1 class="login-title">Bem-vindo</h1>
      <p class="login-subtitle">Acesse sua conta para continuar</p>
  
      <form class="login-form" novalidate>
        <label class="login-field">
          <span>E-mail</span>
          <input type="email" name="email" placeholder="seu@email.com" required (input)="onInputEmail($event)"/>
        </label>
  
        <label class="login-field">
          <span>Senha</span>
          <input type="password" name="password" placeholder="••••••••" required (input)="onInputPassword($event)"/>
        </label>
  
        <a href="#" class="login-forgot">Esqueceu a senha?</a>
  
        @if(errorMessage != ""){
          <p class="errorMessage">{{errorMessage}}</p>
        }
        
        <button type="submit" class="login-button" (click)="onClickLoginButton($event)">Entrar</button>
      </form>
      <p>Não tem conta? <button (click)="clickBotaoCadastrarUsuario()">Cadastre-se</button></p>
    </div>
  </section>
}
@else{
  <section class="login-page">
    <div class="logged-in-card">
      <img src="assets/logo.svg" alt="Logo CoreOne" class="login-logo" />
      <h1 class="login-title">Bem-vindo de volta!</h1>
      <p class="logged-in-email">{{loggedUserEmail}}</p>
      <h2 class="recent-title">Ações recentes no sistema</h2>
      <ul class="recent-list">
        @for(action of recentActions; track action){
          <li class="recent-item">{{action}}</li>
        }
      </ul>
      <button class="logout-button" (click)="onLogout()">Sair</button>
    </div>
  </section>
}

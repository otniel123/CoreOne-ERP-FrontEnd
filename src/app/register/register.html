@if (registered === false) {
  <section class="register-page">
    <div class="register-card">
      <div class="register-header">
        <div class="logo"></div>
        <h1 class="brand">CoreOne ERP</h1>
      </div>
  
      <p class="subtitle">Criar conta</p>
  
      <form class="register-form" (ngSubmit)="onSubmit()">
        <label class="field">
          <span>Usuário</span>
          <input type="text" name="username" placeholder="Seu nome de usuário" [(ngModel)]="enteredUsername"/>
        </label>
  
        <label class="field">
          <span>E-mail</span>
          <input type="email" name="email" placeholder="seu@email.com" [(ngModel)]="enteredEmail"/>
        </label>
  
        <label class="field">
          <span>Senha</span>
          <input type="password" name="password" placeholder="••••••••" [(ngModel)]="enteredPassword"/>
        </label>
  
        <label class="field">
          <span>Confirmar senha</span>
          <input type="password" name="password" placeholder="••••••••" [(ngModel)]="confirmPassowrd"/>
        </label>
  
        @if (errorMessage != '') {
          <p class="errorMessage">{{errorMessage}}</p>
        }
  
        <button type="submit" class="submit-button">Cadastrar</button>
      </form>
  
      <p class="login-link">
        Já tem conta? <a href="#" (click)="onClickEntrar()">Entrar</a>
      </p>
    </div>
  </section> 
}@else {
  <section class="feedback-page">
    <div class="feedback-card">
      <div class="feedback-header">
        <div class="logo"></div>
        <h1 class="brand">Conta criada com sucesso</h1>
      </div>
  
      <p>Conta criada com sucesso,{{enteredUsername}}</p>
      <button class="submit-button" (click)="onClickVoltarLogin()">Voltar a tela de login</button>
  
    </div>
  </section> 
}
